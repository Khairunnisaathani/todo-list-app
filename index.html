<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My To-Do List</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <header>
            <h1>My To-Do List</h1>
            <p>Plan your day. Achieve your goals.</p>
        </header>

        <form id="task-form">
            <input
                type="text"
                id="task-input"
                placeholder="Enter a new task..."
                autocomplete="off"
                required
            >
            <button type="submit" id="add-btn">Add Task</button>
        </form>

        <div class="filters">
            <button class="filter-btn active" data-filter="all">All</button>
            <button class="filter-btn" data-filter="pending">Pending</button>
            <button class="filter-btn" data-filter="completed">Completed</button>
        </div>

        <p id="task-count">0 tasks remaining</p>

        <ul id="task-list"></ul>

        <p id="empty-message">No tasks yet. Add your first task!</p>

        <button id="clear-completed">Clear Completed Tasks</button>

        <footer>
            <p>Stay focused. Keep growing! ✨</p>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
